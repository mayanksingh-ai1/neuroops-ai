x-backend: &backend
  build: ./backend
  init: true
  env_file: [.env]
  environment:
    APP_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set a container DATABASE_URL using db as the hostname}
    AUTH_USERS_JSON: ${AUTH_USERS_JSON:?Configure hashed user access tokens}
  read_only: true
  tmpfs: ['/tmp:size=64m,noexec,nosuid']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 128
  mem_limit: 1g
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuroops
      POSTGRES_USER: neuroops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong unique database password}
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U neuroops -d neuroops']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    restart: 'no'
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs: ['/tmp:size=32m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 128m
    depends_on:
      backend: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres_data:
