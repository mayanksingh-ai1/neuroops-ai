services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://neuroops:local_dev_only_change_me@db:5432/neuroops
      IMPORT_API_KEY: ${IMPORT_API_KEY:?Set IMPORT_API_KEY in your shell or .env before starting Compose}
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuroops
      POSTGRES_USER: neuroops
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroops -d neuroops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
