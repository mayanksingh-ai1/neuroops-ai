services:
  - type: web
    name: neuroops-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neuroops-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "false"
      - key: MOCK_LLM_PROVIDER
        value: "true"
      - key: IMPORT_API_KEY
        generateValue: true
      - key: CORS_ORIGINS_JSON
        value: '["https://mayanksingh-ai1.github.io","http://localhost:5173","http://localhost:8080"]'

databases:
  - name: neuroops-postgres
    plan: free
    region: oregon
    databaseName: neuroops
    user: neuroops
